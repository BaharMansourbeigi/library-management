{% extends "base.html" %}
{% block title %}Delete Book{% endblock %}
{% block content %} 
    <div class="card" style="max-width: 500px;"> 
        <div class="card-body">
            <h1 class="h4 mb-3">Delete "{{ book.title }}"?</h1>
            <p class="text-muted">This action cannot be undone.</p>
            <form method="post">
                {% csrf_token %}
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-danger">Yes, delete</button>
                    <a href="{% url 'book_detail' book.pk %}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
